<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Login</title>
    <link rel="stylesheet" href="Signup.css">
</head>
<body>
    <header class="navbar">
        <ul class="rowhome">
            <li><a href="Home.html">Home</a></li>
            <li><a href="Join-trips.html">Join Trips</a></li>
            <li><a href="activity-selection.html">Activity</a></li>
            <li><a href="Cost.html">Cost</a></li>
            <li><a href="Contact.html">Contact</a></li> 
        </ul>
    </header>

    <div class="container">
        <div class="form-box">
            <div class="toggle-buttons">
                <button id="signupBtn" onclick="showForm('signup')">Sign Up</button>
                <button id="loginBtn" onclick="showForm('login')">Login</button>
            </div>

            <!-- Signup Form -->
            <form id="signup-form">
                <h2>Create an Account</h2>
                <input type="text" id="fullname" placeholder="Full Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>

            <!-- Login Form -->
            <form id="login-form" style="display: none;">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <script>
        function showForm(formType) {
            if (formType === 'signup') {
                document.getElementById('signup-form').style.display = 'block';
                document.getElementById('login-form').style.display = 'none';
            } else {
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('login-form').style.display = 'block';
            }
        }

        // Automatically show the signup form when redirected from Home
        document.addEventListener("DOMContentLoaded", function() {
            showForm('signup'); 
        });
    </script>
</body>
</html>
